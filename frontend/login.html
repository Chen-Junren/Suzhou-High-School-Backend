<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 社团管理系统</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .login-title {
            text-align: center;
            margin-bottom: 25px;
            color: #495057;
        }
        .btn-login {
            background-color: #17a2b8;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background-color: #138496;
            transform: translateY(-2px);
        }
        .form-control:focus {
            border-color: #17a2b8;
            box-shadow: 0 0 0 0.2rem rgba(23, 162, 184, 0.25);
        }
        .form-group {
            position: relative;
        }
        .form-group i {
            position: absolute;
            left: 15px;
            top: 35px;
            color: #6c757d;
        }
        .form-group input {
            padding-left: 40px;
        }
        .footer {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa fa-university mr-2"></i>社团管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fa fa-home mr-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clubs.html"><i class="fa fa-building mr-1"></i>社团列表</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="auth-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="login.html"><i class="fa fa-sign-in mr-1"></i>登录</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html"><i class="fa fa-user-plus mr-1"></i>注册</a>
                    </li>
                </ul>
                <ul class="navbar-nav d-none" id="user-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" data-bs-toggle="dropdown">
                            <i class="fa fa-user-circle mr-1"></i><span id="username"></span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" href="profile.html"><i class="fa fa-user mr-1"></i>个人资料</a>
                            <a class="dropdown-item" href="my-clubs.html"><i class="fa fa-list mr-1"></i>我的社团</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#" onclick="logout()"><i class="fa fa-sign-out mr-1"></i>退出登录</a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="container flex-grow-1">
        <div class="login-container">
            <h2 class="login-title">
                <i class="fa fa-sign-in mr-2"></i>用户登录
            </h2>
            
            <form id="login-form">
                <div class="form-group mb-4">
                    <i class="fa fa-user"></i>
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
                    <div class="invalid-feedback"></div>
                </div>
                
                <div class="form-group mb-4">
                    <i class="fa fa-lock"></i>
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                    <div class="invalid-feedback"></div>
                </div>
                
                <div class="form-group form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="remember-me">
                    <label class="form-check-label" for="remember-me">记住我</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-login">
                    <i class="fa fa-sign-in mr-1"></i>登录
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <p>还没有账号？<a href="register.html">立即注册</a></p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5>关于我们</h5>
                    <p>社团管理系统致力于为校园社团提供便捷的管理和交流平台。</p>
                </div>
                <div class="col-md-4">
                    <h5>联系方式</h5>
                    <p><i class="fa fa-envelope mr-1"></i> support@clubsystem.edu</p>
                    <p><i class="fa fa-phone mr-1"></i> 123-4567-8910</p>
                </div>
                <div class="col-md-4">
                    <h5>关注我们</h5>
                    <a href="#" class="text-white mr-3"><i class="fa fa-weixin fa-lg"></i></a>
                    <a href="#" class="text-white mr-3"><i class="fa fa-weibo fa-lg"></i></a>
                    <a href="#" class="text-white"><i class="fa fa-github fa-lg"></i></a>
                </div>
            </div>
            <div class="text-center mt-4">
                <p>&copy; 2023 社团管理系统. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- 模拟数据 -->
    <script src="js/mock-data.js"></script>
    <!-- 通用脚本 -->
    <script src="js/common.js"></script>
    <!-- 登录脚本 -->
    <script src="js/login.js"></script>
</body>
</html>
